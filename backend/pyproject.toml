[project]
name = "hcm-lite-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3",
  "langgraph>=1,<2", "langchain-core>=1,<2",
  "langchain-google-genai>=4,<5", "uvicorn>=0.30,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/ai/tests"]
pythonpath = ["."]
