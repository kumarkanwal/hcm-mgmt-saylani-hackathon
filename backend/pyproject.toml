[project]
name = "hcm-lite-backend"
version = "0.1.0"
description = "HCM Lite API backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "bcrypt>=4.2,<6",
    "fastapi>=0.115,<1",
    "email-validator>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "sqlalchemy>=2.0,<3",
    "slowapi>=0.1.9,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
